[project]
name = "cinesis-load-matcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<3", "pydantic>=2.10,<3", "openpyxl>=3.1,<4", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["test_solver.py"]

[tool.ruff]
line-length = 100
