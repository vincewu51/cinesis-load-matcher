[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cinesis-load-matcher"
version = "0.1.0"
description = "Evidence-backed LLM profile extraction and auditable freight-load ranking"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<3", "pydantic>=2.10,<3", "openpyxl>=3.1,<4", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
cinesis = "cinesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
